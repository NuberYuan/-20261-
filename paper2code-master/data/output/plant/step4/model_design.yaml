paper_name: plant
models:
- name: Deep Convolutional Neural Network (CNN) for Plant Disease Classification
  type: CNN
  input: NOT_FOUND
  output: NOT_FOUND
  num_classes: 38 classes (14 crop species and 26 diseases, or absence thereof)
