paper_name: 论文3
parameter_provenance:
  paper_confirmed:
  - learning_rate
  - loss_function
  - optimizer_name
  inferred_from_paper:
  - scheduler_name
  - scheduler_step_size
  - scheduler_gamma
  - dropout_ratio
  - image_size
  engineering_default:
  - checkpoint.save_best
  - checkpoint.best_metric
  - checkpoint.save_final
  - checkpoint.save_optimizer_state
  - inference.device
  NOT_FOUND_in_paper:
  - early_stopping
  - checkpoint.save_frequency_epochs
  - inference.batch_size
  - freeze_backbone
  note: 'paper_confirmed: 值直接来自论文 implementation_details；inferred_from_paper: 从论文描述推断但非逐字引用；engineering_default:
    我们选择的工程实践值；NOT_FOUND_in_paper: 论文未提供，需自行决定'
training_modes:
  scratch:
    description: 从头训练：所有层随机初始化
    pretrained: false
    weight_init: kaiming_normal
    reset_layers: []
    freeze_backbone: false
training:
  batch_size: NOT_FOUND
  batch_size_note: 论文显式指定 batch_size；若为多模型，逐模型数值见 batch_size 字段。
  epochs: '30'
  image_size: 'cell nuclei: 96×96, colon polyp: 224×224, liver: 512×512, lung nodule:
    64×64×64'
  optimizer:
    name: Adam
    lr: '4'
    momentum: NOT_FOUND
    weight_decay: NOT_FOUND
  scheduler:
    name: NOT_FOUND
    step_size: NOT_FOUND
    gamma: NOT_FOUND
    note: 论文未明确说明学习率调度器，训练时可选用 StepLR 等常见策略。
  loss_function: a combination of binary crossentropy and dice coefficient
  dropout_ratio: NOT_FOUND
  early_stopping: Early stop mechanism on the validation set
checkpoint:
  save_best: true
  best_metric: val_accuracy
  best_mode: max
  save_final: true
  save_frequency_epochs: NOT_FOUND
  save_optimizer_state: true
  resume_from: NOT_FOUND
  note: 论文无独立验证集，best_metric 设为 val_accuracy 是工程偏离。如严格复现论文，应从训练集二次划分验证集，或直接用 test_accuracy（不推荐，会导致数据泄露）。
train_test_splits:
- NOT_FOUND
inference:
  device: NVIDIA TITAN X (Pascal) with 12 GB memory (for inference time measurement)
  batch_size: NOT_FOUND
reproducibility_notes:
- Train/test split details not provided in main paper (in supplementary material)
- Data preprocessing details not provided in main paper (in supplementary material)
- Batch size not specified
- Number of epochs not specified (early stopping used)
- Programming framework not specified
- Exact implementation of dense convolution block concatenation and upsampling requires
  careful attention to Equation 1
