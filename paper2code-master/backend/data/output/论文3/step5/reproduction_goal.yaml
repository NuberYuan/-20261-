paper_name: 论文3
title: 'UNet++: A Nested U-Net Architecture for Medical Image Segmentation'
research_problem: Medical image segmentation demands higher accuracy than natural
  image segmentation. Even marginal segmentation errors in medical images can lead
  to poor clinical outcomes, such as exclusion of subtle spiculation patterns around
  a nodule indicating malignancy or erroneous measurement of nodule growth resulting
  in incorrect Lung-RADS category assignment. It is therefore desired to devise more
  effective image segmentation architectures that can effectively recover the fine
  details of the target objects in medical images.
motivation: Plain skip connections in U-Net directly fast-forward high-resolution
  feature maps from the encoder to the decoder network, resulting in the fusion of
  semantically dissimilar feature maps. The hypothesis is that the model can more
  effectively capture fine-grained details of the foreground objects when high-resolution
  feature maps from the encoder network are gradually enriched prior to fusion with
  the corresponding semantically rich feature maps from the decoder network.
main_contribution: UNet++, a deeply-supervised encoder-decoder network where the encoder
  and decoder subnetworks are connected through a series of nested, dense skip pathways
  that reduce the semantic gap between feature maps. UNet++ with deep supervision
  achieves an average IoU gain of 3.9 and 3.4 points over U-Net and wide U-Net respectively
  across four medical image segmentation tasks.
paper_type: model_proposing
task: image_classification
input: 96×96 (cell nuclei), 224×224 (colon polyp), 512×512 (liver), 64×64×64 (lung
  nodule)
output: Four segmentation maps given an input image, which will be further averaged
  to generate the final segmentation map
num_classes: 2 (binary segmentation)
reproduction_targets:
- 实现论文提出的模型架构
- 复现训练流程
- 复现评估指标计算
- 验证与论文结果的一致性
is_trainable: true
