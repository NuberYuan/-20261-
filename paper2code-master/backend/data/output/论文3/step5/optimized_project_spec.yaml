project:
  name: UNet_A_Nested_UNet_Architecture_for_Medical_Image_
  description: image_classification
  paper_type: model_proposing
architecture:
  modules:
    data:
      directory: data/
      files:
      - dataset.py
      description: 数据加载与预处理
    models:
      directory: models/
      files:
      - densenet.py
      description: '模型定义: densenet'
      classes:
      - name: Densenet
        type: CNN
        input: 96×96 (cell nuclei), 224×224 (colon polyp), 512×512 (liver), 64×64×64
          (lung nodule)
        output: Four segmentation maps given an input image, which will be further
          averaged to generate the final segmentation map
        pretrained: NOT_FOUND
        file: models/densenet.py
    training:
      directory: training/
      files:
      - train.py
      description: 训练循环
    evaluation:
      directory: evaluation/
      files:
      - evaluate.py
      description: 评估与对比
    utils:
      directory: utils/
      files:
      - metrics.py
      description: 工具函数
    config:
      directory: config/
      files:
      - config.yaml
      description: YAML 配置
dependencies:
  files:
  - README.md
  - config/config.yaml
  - data/dataset.py
  - evaluation/evaluate.py
  - main.py
  - models/densenet.py
  - requirements.txt
  - training/train.py
  - utils/metrics.py
  external:
  - torch
  - torchvision
  - numpy
  - pyyaml
  - scikit-learn
  - pillow
  - opencv-python
execution_flow:
- 1. 加载配置 (config/config.yaml)
- '2. data/: 准备数据集和数据加载器'
- '3. models/: 初始化模型'
- '4. training/train.py: 训练循环与验证评估'
- '5. evaluation/: 测试集评估'
reproducibility_notes:
- Train/test split details not provided in main paper (in supplementary material)
- Data preprocessing details not provided in main paper (in supplementary material)
- Batch size not specified
- Number of epochs not specified (early stopping used)
- Programming framework not specified
- Exact implementation of dense convolution block concatenation and upsampling requires
  careful attention to Equation 1
code_requirements: {}
