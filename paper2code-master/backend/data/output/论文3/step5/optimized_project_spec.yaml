project:
  name: UNet_A_Nested_UNet_Architecture_for_Medical_Image_
  description: image_classification
  paper_type: empirical_comparison
architecture:
  modules:
    data:
      directory: data/
      files:
      - dataset.py
      description: 数据加载与预处理
    models:
      directory: models/
      files:
      - u_net.py
      description: '模型定义: u_net'
      classes:
      - name: UNet
        type: other
        input: 'Input sizes per dataset: cell nuclei 96×96, colon polyp 224×224, liver
          512×512, lung nodule 64×64×64'
        output: Full-resolution segmentation maps at multiple semantic levels; deep
          supervision generates four segmentation maps, which are averaged to generate
          the final segmentation map
        pretrained: NOT_FOUND
        file: models/unet.py
    training:
      directory: training/
      files:
      - train.py
      description: 训练循环
    evaluation:
      directory: evaluation/
      files:
      - evaluate.py
      - compare.py
      description: 评估与对比
    utils:
      directory: utils/
      files:
      - metrics.py
      description: 工具函数
    config:
      directory: config/
      files:
      - config.yaml
      description: YAML 配置
dependencies:
  files:
  - README.md
  - config/config.yaml
  - data/dataset.py
  - evaluation/compare.py
  - evaluation/evaluate.py
  - main.py
  - models/u_net.py
  - models/unet.py
  - requirements.txt
  - training/train.py
  - utils/metrics.py
  external:
  - torch
  - torchvision
  - numpy
  - pyyaml
  - scikit-learn
  - pillow
  - opencv-python
execution_flow:
- 1. 加载配置 (config/config.yaml)
- '2. data/: 准备数据集和数据加载器'
- '3. models/: 初始化模型'
- '4. training/train.py: 训练循环与验证评估'
- '5. evaluation/: 测试集评估与对比'
reproducibility_notes:
- Batch size is not explicitly specified in the main paper
- Training epoch count is not provided; training uses early stopping on validation
  set
- Data preprocessing details are deferred to supplementary material
- No deep learning framework is explicitly stated in the paper
code_requirements: {}
