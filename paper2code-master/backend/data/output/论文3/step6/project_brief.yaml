requirements_digest:
  summary: 本项目包含 6 个功能需求（FR-01、FR-02、FR-03、FR-04、FR-05、FR-06），涉及 dataset, methodology,
    implementation_details, reproduction_requirements, experiment 维度。
  core_requirements:
  - id: FR-01
    what: '加载 cell nuclei, colon polyp, liver, lung nodule 数据集（cell nuclei: 670; colon
      polyp: 7,379; liver: 331; lung nodule: 1,012），支持从本地路径读取原始图像文件'
    why: 论文指定数据集与预处理要求
    acceptance: '加载后样本数应与 cell nuclei: 670; colon polyp: 7,379; liver: 331; lung nodule:
      1,012 一致'
  - id: FR-02
    what: 构建 UNet++ 模型，能够接收预处理后的输入并输出预测结果
    why: 论文对比的模型与训练策略
    acceptance: 模型可正常实例化并通过前向传播；参数量在合理数量级范围内 （与参考实现同一量级），但不同框架实现可能导致 ±5% 差异（如归一化层、padding
      策略差异），不要求逐参数精确匹配。
  - id: FR-03
    what: 使用 Adam 优化器（lr=4）训练模型 NOT_FOUND 个 epoch，batch_size=NOT_FOUND，损失函数为 binary
      cross-entropy + dice coefficient。
    why: 论文指定的训练超参数
    acceptance: 训练 NOT_FOUND epoch 能完整跑通（无中断、无显存溢出），loss 呈下降趋势。不要求最终 accuracy 接近论文报告值（本阶段只保证训练流程正确，不包含论文原始数据集的完整复现）。
  - id: FR-04
    what: 保存训练过程中最优模型权重和最终模型权重
    why: 复现实验所需
    acceptance: 加载保存的权重后可恢复推理，精度不下降
  - id: FR-05
    what: '在测试集上计算评估指标: Dice coefficient, Intersection over Union (IoU)'
    why: 论文报告的主要结果
    acceptance: 输出 Dice coefficient, Intersection over Union (IoU) 的值，与论文报告值对比
  - id: FR-06
    what: '[论文要求] 计算并报告: Dice coefficient, Intersection over Union (IoU)。关键发现: UNet++
      with deep supervision achieved an average IoU gain of 3.9 and 3.4 points over
      U-Net a…'
    why: 论文报告的主要结果
    acceptance: '[论文要求] 评估指标值与论文报告值在容差范围内一致；[工程辅助] 图表可正确生成，不要求与论文图表逐像素一致'
  data_flow_overview: '数据依次经过: 数据加载（原始图像 (PIL.Image / numpy.ndarray)） → 数据预处理（归一化张量）
    → 模型构建（模型定义）（Full-resolution segmentation maps at multiple semantic levels; deep
    supervision generates four segmentation maps, which are averaged to generate the
    final segmentation map） → 模型训练（训练好的模型权重 + 训练日志） → 模型评估（评估报告（指标数值 + 可视化））。'
  key_interfaces:
  - from: 数据加载
    to: 数据预处理
    data: 原始图像 (PIL.Image / numpy.ndarray)
  - from: 数据预处理
    to: 模型构建（模型定义）
    data: 归一化张量 (B, 3, NOT_FOUND, NOT_FOUND)
  - from: 模型构建（模型定义）
    to: 模型训练
    data: 'NOT_FOUND类概率分布 + (可选: 带辅助分类器模型的 aux1_logits, aux2_logits)'
  - from: 模型训练
    to: 模型评估
    data: 训练好的模型权重 + 训练日志（loss/accuracy 曲线数据）
design_digest:
  summary: 项目采用 PyTorch 框架，实现 UNet++，目录结构包含 data, models, training, evaluation, utils,
    config 模块，入口为 main.py。
  tech_stack:
    framework: PyTorch
    key_dependencies:
    - numpy
    - pillow
    - pyyaml
    - matplotlib
    hardware: one NVIDIA TITAN X (Pascal) with 12 GB memory
  models:
  - name: UNet
    type: other
    file: models/u_net.py
    key_params: num_classes=NOT_FOUND, pretrained=否
  project_structure:
    root_directories:
    - data
    - models
    - training
    - evaluation
    - utils
    - config
    entry_point: main.py
  training_config_summary:
    optimizer: Adam
    learning_rate: '4'
    batch_size: NOT_FOUND
    epochs: '30'
    loss: binary cross-entropy + dice coefficient
    scheduler: NOT_FOUND (step_size=NOT_FOUND, gamma=NOT_FOUND)
decisions:
  framework: PyTorch
  data_source: external_dataset
  acquisition: local_path
  val_split_ratio: 0.2
  val_split_note: 80/20 从训练集二次划分出验证集（工程默认，非论文要求）
  training_modes:
  - scratch
  best_metric: val_accuracy
data_dependency:
  data_source: external_dataset
  acquisition: local_path
  note: LLM 判定失败，回退默认 external_dataset/local_path
