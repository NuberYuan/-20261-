code_generation_plan:
  generation_order:
  - phase: 1
    description: 基础配置
    files:
    - config/config.yaml
    reason: 配置是所有后续模块的基础，必须先定义。
  - phase: 2
    description: 数据模块
    files:
    - data/dataset.py
    reason: 数据加载依赖配置。
  - phase: 3
    description: 核心逻辑（模型/算法）
    files:
    - models/u_net.py
    - models/__init__.py
    reason: 模型/算法是训练和评估的前提。
  - phase: 4
    description: 工具模块
    files:
    - utils/metrics.py
    reason: 指标计算等工具函数。
  - phase: 5
    description: 训练与评估
    files:
    - training/train.py
    - evaluation/evaluate.py
    - evaluation/compare.py
    reason: 训练依赖模型和数据，评估依赖训练好的模型。
  - phase: 6
    description: 入口与文档
    files:
    - main.py
    - requirements.txt
    - README.md
    reason: 入口文件整合所有模块，文档和依赖列表最后生成。
  per_file_specs:
  - file: data/dataset.py
    purpose: 实现数据集加载、预处理和划分
    classes:
    - CellNucleiColonPolypLiverLungNoduleDataset
    key_methods:
    - __init__
    - __len__
    - __getitem__
    - preprocess_image
    - split_dataset
    depends_on:
    - config/config.yaml
    satisfies_requirements:
    - FR-01
    notes: 实现数据集加载、预处理和划分。需处理 NOT_FOUND 等版本。所有 open() 读文件必须显式 encoding='utf-8'（config.yaml
      含中文，Windows 默认 GBK 会读崩）。【version 数据流】get_dataloaders（或等价加载函数）必须接受 version 参数（默认
      'color'），并把它原样传给 CellNucleiColonPolypLiverLungNoduleDataset(version=...)；绝不能从
      config['data'] 读默认值写死，否则各版本实验无差别。图像加载用 PIL（Pillow，已在依赖列表），不要引入 opencv（cv2）——cv2
      不在依赖列表里。【train/val/test 增强分离】训练集必须加论文指定的数据增强，验证集/测试集绝不能加。因为 Subset 共享同一个底层 Dataset
      对象，严禁写 splits['train'].dataset.transform = ... 这种改共享对象属性的写法（后写的覆盖先写的，训练集会因此丢增强）。正确做法：底层
      Dataset.__getitem__ 只返回原始 PIL 图 + label（不设 transform），再用轻量包装类 TransformSubset(Dataset)（持有一个
      Subset + 一个 transform，__getitem__ 先取 (x,y) 再套 transform）分别包 train/test/val：train
      用 get_transform(train=True)，test/val 用 get_transform(train=False)。【unresolved
      版本】segmented 的数据来源/处理方法在论文中 NOT_FOUND（无完整参数）。初始化时必须读取 config['data'][version]['status']（顶层，如
      config['data'][<version>]['status']，不是 config['data']['versions'][...]）；若 ==
      'unresolved'，立即 raise NotImplementedError(reason)，严禁用其他版本兜底伪装。
  - file: models/u_net.py
    purpose: 定义 UNet 模型结构
    classes:
    - UNet
    key_methods:
    - __init__
    - forward
    depends_on:
    - config/config.yaml
    satisfies_requirements:
    - FR-02
    notes: '定义 UNet（随机初始化结构，无迁移学习/预训练权重）。按论文模型结构实现前向传播，不要引入 torchvision 继承或 transfer
      分支。num_classes、dropout_ratio、pretrained 等参数一律从 config.yaml 读取，不要硬编码。【形状参数 null
      兜底】若 config 里的 num_classes/dropout_ratio 等形状参数是 null（论文未给具体类别数/词汇表大小），严禁把 None
      传给 nn.Linear / nn.Embedding 等任何 torch 形状参数（会 empty(): argument ''size'' 崩溃）；必须用从论文描述推导的具体默认值兜底（如「词汇表
      = 数字位数 + 特殊符号」→ 一个具体 int），并在代码注释里写明该默认值来源。模型类只定义结构（随机初始化），不要写 training_mode/transfer
      分支、不要在 __init__ 里 load_state_dict；权重初始化统一在 training/train.py 的 initialize_model
      里处理。所有 open() 读 config.yaml 必须 encoding=''utf-8''。'
  - file: models/__init__.py
    purpose: 模型模块的初始化文件，便于统一导入
    classes: []
    key_methods: []
    depends_on: []
    satisfies_requirements: []
    notes: '导出各模型类，类名必须与各模型文件定义完全一致: from .u_net import UNet。不要自行改名或改成其他拼写。'
  - file: training/train.py
    purpose: 实现模型训练流程
    classes: []
    key_methods:
    - initialize_model
    - train_model
    - save_model
    depends_on:
    - config/config.yaml
    - data/dataset.py
    - models/u_net.py
    satisfies_requirements:
    - FR-03
    - FR-04
    notes: 从本地 models 包导入模型类（类名见相关代码）；保存最终模型。所有 open() 读 config.yaml 必须 encoding='utf-8'。【权重初始化】从头训练：initialize_model
      里用模型类随机初始化，不要加载任何预训练权重、不要引入 torchvision 或 transfer 逻辑。【reproduction_mode】读 config['reproduction_mode']：'engineering'=train→val→best→test：从训练集二次划分
      val（config.split_strategy.val_split_ratio，80/20），每 epoch 验证、按 val_accuracy 选最优
      checkpoint；'strict'=train→最终→test：不划分 val、不验证、只保存最终模型，train_model 里 val_loader
      可为 None 且必须能跳过验证分支。train_model 的 validate 调用必须用 if val_loader is not None 守卫，不能无条件调用。【train/test
      语义】论文仅 train/test 二路划分、无独立验证集，val 仅在 engineering 模式从训练集二次划分；test 集只用于最终评估，绝不能进入
      train_loader 或 val_loader。【version 数据流】从 experiment.runs[].dataset_version 读取版本，调用
      get_dataloaders 时显式传 version=dataset_version。
  - file: evaluation/evaluate.py
    purpose: 实现模型评估和报告生成
    classes: []
    key_methods:
    - evaluate_model
    - generate_report
    depends_on:
    - config/config.yaml
    - training/train.py
    - utils/metrics.py
    - models/u_net.py
    satisfies_requirements:
    - FR-05
    - FR-06
