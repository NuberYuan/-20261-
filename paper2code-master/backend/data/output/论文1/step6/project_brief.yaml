requirements_digest:
  summary: 本项目包含 10 个功能需求（FR-01、FR-02、FR-03、FR-04、FR-05、FR-06、FR-07、FR-08、FR-09、FR-10），涉及
    dataset, methodology, implementation_details, reproduction_requirements, experiment
    维度。
  core_requirements:
  - id: FR-01
    what: 加载 PlantVillage 数据集（54,306 images），支持从本地路径读取原始图像文件
    why: 论文指定数据集与预处理要求
    acceptance: 加载后样本数应与 54,306 images 一致
  - id: FR-02
    what: '预处理步骤: All images resized to 256 x 256 pixels. Three versions of the dataset
      used: color (as is), grayscale, and leaf segmented (background removed). Segmentati…'
    why: 论文指定数据集与预处理要求
    acceptance: 检查输出张量的 shape 和数值范围
  - id: FR-03
    what: '按 Multiple train-test splits: 80-20, 60-40, 50-50, 40-60, 20-80. Images
      of the same leaf (mappings available for 41,112 out of 54,306 images) always
      go either i…'
    why: 论文指定数据集与预处理要求
    acceptance: 各集合样本数符合设定比例
  - id: FR-04
    what: 构建 Alexnet 模型，能够接收预处理后的输入并输出预测结果
    why: 论文对比的模型与训练策略
    acceptance: 模型可正常实例化并通过前向传播；参数量在合理数量级范围内 （与参考实现同一量级），但不同框架实现可能导致 ±5% 差异（如归一化层、padding
      策略差异），不要求逐参数精确匹配。
  - id: FR-05
    what: 构建 Googlenet 模型，能够接收预处理后的输入并输出预测结果
    why: 论文对比的模型与训练策略
    acceptance: 模型可正常实例化并通过前向传播；参数量在合理数量级范围内 （与参考实现同一量级），但不同框架实现可能导致 ±5% 差异（如归一化层、padding
      策略差异），不要求逐参数精确匹配。
  - id: FR-06
    what: '支持两种独立的训练模式: (a) 从头训练(Scratch): 所有层随机初始化（Kaiming/Xavier），不使用预训练权重；(b) 迁移学习(Transfer):
      加载 ImageNet 预训练权重，重置最后一层(ImageNet pretrained weights for transfer learning…'
    why: 论文对比的模型与训练策略
    acceptance: scratch 模式下所有权重随机且不含预训练统计量；transfer 模式下除最后一层外与预训练权重一致，最后一层为随机初始化。
  - id: FR-07
    what: 使用 Stochastic Gradient Descent 优化器（lr=0.005）训练模型 30 个 epoch，batch_size=24
      (in case of GoogLeNet), 100 (in case of AlexNet)，损失函数为 softmax cross-entropy
      (inferred…
    why: 论文指定的训练超参数
    acceptance: 训练 30 epoch 能完整跑通（无中断、无显存溢出），loss 呈下降趋势。不要求最终 accuracy 接近论文报告值（本阶段只保证训练流程正确，不包含论文原始数据集的完整复现）。
  - id: FR-08
    what: 保存训练过程中最优模型权重和最终模型权重
    why: 复现实验所需
    acceptance: 加载保存的权重后可恢复推理，精度不下降
  - id: FR-09
    what: '在测试集上计算评估指标: Mean F1 score, mean precision, mean recall, overall accuracy'
    why: 论文报告的主要结果
    acceptance: 输出 Mean F1 score, mean precision, mean recall, overall accuracy 的值，与论文报告值对比
  - id: FR-10
    what: '[论文要求] 计算并报告: Mean F1 score, mean precision, mean recall, overall accuracy。关键发现:
      The best performing model (GoogLeNet::TransferLearning::Color::80-20) achieves
      …'
    why: 论文报告的主要结果
    acceptance: '[论文要求] 评估指标值与论文报告值在容差范围内一致；[工程辅助] 图表可正确生成，不要求与论文图表逐像素一致'
  data_flow_overview: '数据依次经过: 数据加载（原始图像 (PIL.Image / numpy.ndarray)） → 数据预处理（归一化张量
    (B, 3, 256, 256)） → 模型构建（模型定义）（38 class probability distribution (fc8 has 38 outputs
    in adapted AlexNet, equaling total number of classes)） → 模型训练（训练好的模型权重 + 训练日志）
    → 模型评估（评估报告（指标数值 + 可视化））。'
  key_interfaces:
  - from: 数据加载
    to: 数据预处理
    data: 原始图像 (PIL.Image / numpy.ndarray)
  - from: 数据预处理
    to: 模型构建（模型定义）
    data: 归一化张量 (B, 3, 256, 256)
  - from: 模型构建（模型定义）
    to: 模型训练
    data: '38类概率分布 + (可选: 带辅助分类器模型的 aux1_logits, aux2_logits)'
  - from: 模型训练
    to: 模型评估
    data: 训练好的模型权重 + 训练日志（loss/accuracy 曲线数据）
design_digest:
  summary: 项目采用 PyTorch 框架，实现 Alexnet, Googlenet，目录结构包含 data, models, training, evaluation,
    utils, config 模块，入口为 main.py。
  tech_stack:
    framework: PyTorch
    key_dependencies:
    - numpy
    - pillow
    - pyyaml
    - torch
    - torchvision
    - matplotlib
    hardware: EPFL GPU cluster computing resources
  models:
  - name: Alexnet
    type: CNN
    file: models/alexnet.py
    key_params: num_classes=38 classes (14 crop species and 26 diseases or absence
      thereof), pretrained=是
  - name: Googlenet
    type: CNN
    file: models/googlenet.py
    key_params: num_classes=38 classes (14 crop species and 26 diseases or absence
      thereof), pretrained=是
  project_structure:
    root_directories:
    - data
    - models
    - training
    - evaluation
    - utils
    - config
    entry_point: main.py
  training_config_summary:
    optimizer: Stochastic Gradient Descent
    learning_rate: '0.005'
    batch_size: 24 (in case of GoogLeNet), 100 (in case of AlexNet)
    epochs: '30'
    loss: softmax cross-entropy (inferred from softmax layer)
    scheduler: StepLR (step_size=10, gamma=0.1)
decisions:
  framework: PyTorch
  data_source: external_dataset
  acquisition: local_path
  val_split_ratio: 0.2
  val_split_note: 80/20 从训练集二次划分出验证集（工程默认，非论文要求）
  training_modes:
  - scratch
  - transfer
  best_metric: val_accuracy
data_dependency:
  data_source: external_dataset
  acquisition: local_path
  note: 论文明确使用 PlantVillage 公开数据集（54,306 张植物叶片图像），需手动下载后提供本地路径，非标准库内置可自动下载。
