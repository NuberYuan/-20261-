paper_name: 论文1
title: Using Deep Learning for Image-Based Plant Disease Detection
research_problem: Crop diseases are a major threat to food security, but their rapid
  identification remains difficult in many parts of the world due to the lack of the
  necessary infrastructure. The paper addresses the problem of automatically identifying
  crop species and disease status from images of plant leaves using deep convolutional
  neural networks.
motivation: The combination of increasing global smartphone penetration and recent
  advances in computer vision made possible by deep learning has paved the way for
  smartphone-assisted disease diagnosis. Historically, disease identification has
  been supported by agricultural extension organizations, and traditional computer
  vision approaches relied on hand-engineered features which were complex and labor-intensive.
  Deep learning eliminates the need for feature engineering and offers generalizability
  for practical and scalable computational inference of plant diseases.
main_contribution: Using a public dataset of 54,306 images of diseased and healthy
  plant leaves collected under controlled conditions, a deep convolutional neural
  network is trained to identify 14 crop species and 26 diseases (or absence thereof)
  across 38 classes, achieving an accuracy of 99.35% on a held-out test set and 31.4%
  on real-world images from trusted online sources, demonstrating the technical feasibility
  of smartphone-assisted crop disease diagnosis.
paper_type: model_proposing
task: image_classification
input: Images resized to 256 x 256 pixels
output: 38 class probability distribution (fc8 has 38 outputs in adapted AlexNet,
  equaling total number of classes)
num_classes: 38 classes (14 crop species and 26 diseases or absence thereof)
reproduction_targets:
- 实现论文提出的模型架构
- 复现训练流程
- 复现评估指标计算
- 验证与论文结果的一致性
is_trainable: true
