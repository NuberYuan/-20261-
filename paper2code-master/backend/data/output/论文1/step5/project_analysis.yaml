reproduction_goal:
  paper_name: 论文1
  title: Using Deep Learning for Image-Based Plant Disease Detection
  research_problem: Crop diseases are a major threat to food security, but their rapid
    identification remains difficult in many parts of the world due to the lack of
    the necessary infrastructure. The paper addresses the problem of automatically
    identifying crop species and disease status from images of plant leaves using
    deep convolutional neural networks.
  motivation: The combination of increasing global smartphone penetration and recent
    advances in computer vision made possible by deep learning has paved the way for
    smartphone-assisted disease diagnosis. Historically, disease identification has
    been supported by agricultural extension organizations, and traditional computer
    vision approaches relied on hand-engineered features which were complex and labor-intensive.
    Deep learning eliminates the need for feature engineering and offers generalizability
    for practical and scalable computational inference of plant diseases.
  main_contribution: Using a public dataset of 54,306 images of diseased and healthy
    plant leaves collected under controlled conditions, a deep convolutional neural
    network is trained to identify 14 crop species and 26 diseases (or absence thereof)
    across 38 classes, achieving an accuracy of 99.35% on a held-out test set and
    31.4% on real-world images from trusted online sources, demonstrating the technical
    feasibility of smartphone-assisted crop disease diagnosis.
  paper_type: model_proposing
  task: image_classification
  input: Images resized to 256 x 256 pixels
  output: 38 class probability distribution (fc8 has 38 outputs in adapted AlexNet,
    equaling total number of classes)
  num_classes: 38 classes (14 crop species and 26 diseases or absence thereof)
  reproduction_targets:
  - 实现论文提出的模型架构
  - 复现训练流程
  - 复现评估指标计算
  - 验证与论文结果的一致性
  is_trainable: true
technology:
  paper_name: 论文1
  framework:
    recommended: PyTorch
    candidates:
    - PyTorch
    source: 复现代码统一使用 PyTorch；论文原文框架见 programming_framework_mentioned
  programming_framework_mentioned: 'Caffe (own fork of Caffe: https://github.com/salathegroup/caffe)'
  model_backbone:
    names:
    - AlexNet
    - GoogLeNet
    source: 论文提到
  architecture_details:
    alexnet: AlexNet consists of 5 convolution layers, followed by 3 fully connected
      layers, and finally ending with a softmax layer. The first two convolution layers
      (conv{1,2}) are each followed by a normalization and a pooling layer, and the
      last convolution layer (conv5) is followed by a single pooling layer. The final
      fully connected layer (fc8) has 38 outputs in the adapted version. All of the
      first 7 layers have a ReLU nonlinearity activation unit. The first two fully
      connected layers (fc{6,7}) have a
    googlenet: 'GoogLeNet is a much deeper and wider architecture with 22 layers,
      while still having considerably lower number of parameters (5 million parameters)
      in the network than AlexNet (60 million parameters). A total of 9 inception
      modules is used. The inception module uses parallel 1x1, 3x3 and 5x5 convolutions
      along with a maxpooling layer in parallel. 1x1 convolutions are added before
      the 3x3, 5x5 convolutions (and also after the maxpooling layer) for dimensionality
      reduction. A filter concatenation '
  training:
    optimizer:
      type: Stochastic Gradient Descent
    loss:
      type: softmax cross-entropy (inferred from softmax layer)
    scheduler:
      type: StepLR
  pretrained_weights:
    used: true
    source: ImageNet pretrained weights for transfer learning. In case of transfer
      learning, they do not limit the learning of the rest of the layers and instead
      just reset the weights of layer fc8 in case of AlexNet; in case of GoogLeNet,
      they similarly do not limit the learning of the rest of the layers but instead
      just reset the weights of the loss{1,2,3}/classifier layers.
  special_modules: 'AlexNet: Dropout layers associated with first two fully connected
    layers (fc{6,7}) with dropout ratio of 0.5. GoogLeNet: Inception modules (9 total),
    1x1 convolutions for dimensionality reduction, filter concatenation layers.'
  hardware:
    mentioned: EPFL GPU cluster computing resources
dataset:
  paper_name: 论文1
  data_source: external_dataset
  acquisition: local_path
  data_source_note: 论文明确使用 PlantVillage 公开数据集（54,306 张植物叶片图像），需手动下载后提供本地路径，非标准库内置可自动下载。
  datasets:
  - name: PlantVillage
    source: PlantVillage project [9], openly and freely available
    size: 54,306 images
    num_classes: 38 classes (14 crop species and 26 diseases or absence thereof)
    data_type: Images of plant leaves (diseased and healthy), collected under controlled
      conditions
  dataset_versions:
  - color
  - grayscale
  - segmented
  preprocessing:
    versions:
      color:
        resize: 256x256
        to_tensor: transforms.ToTensor()
        dtype: torch.float32
        description: 彩色版本：保持原始RGB三通道
        channels: 3
        normalization: &id001
          mean:
          - 0.485
          - 0.456
          - 0.406
          std:
          - 0.229
          - 0.224
          - 0.225
          note: ImageNet 标准归一化；不使用预训练权重时可替换为 [0.5,0.5,0.5]
        augmentation:
        - name: RandomHorizontalFlip
          p: 0.5
      grayscale:
        resize: 256x256
        to_tensor: transforms.ToTensor()
        dtype: torch.float32
        description: 灰度版本：转换为单通道后重复为3通道
        channels: 3
        source_channels: 1
        channel_handling:
          paper_stated: NOT_FOUND — 论文未明确说明灰度图是保持1通道还是复制为3通道
          inferred_approach: repeat to 3 channels
          inference_basis: 预训练权重基于 ImageNet 3 通道输入；常见框架的图像加载层默认期望 3 通道；论文未提及修改第一层
            conv1 的 in_channels。因此推断灰度图被复制为 3 通道以适配预训练模型。
          alternatives:
          - '方案A (推荐): repeat 3通道，适配预训练权重，与论文结果可比'
          - '方案B: 保持1通道，修改 conv1 的 in_channels=1，但无法使用预训练权重'
          choice: 方案A — repeat to 3 channels
        pipeline:
        - transforms.Grayscale(num_output_channels=1)
        - transforms.ToTensor()
        - 'lambda x: x.repeat(3, 1, 1)'
        normalization: *id001
        augmentation:
        - name: RandomHorizontalFlip
          p: 0.5
        note: 灰度版本为常见消融变体，用于验证颜色信息对任务的贡献
      segmented:
        resize: 256x256
        to_tensor: transforms.ToTensor()
        dtype: torch.float32
        description: 分割版本：论文提及的分割预处理（去除背景、保留目标区域）；具体算法与参数需从论文确认，未公开时需自行实现或替代。
        channels: 3
        segmentation_algorithm:
          method: NOT_FOUND — 论文未公开具体分割算法
          color_spaces: []
          components: []
          fixed_color_casts: false
          implementation_status: 'NOT_FOUND: 论文提及分割思路但未提供完整算法/参数'
          fallback: 如无法复现分割脚本，可使用 GrabCut 或 U-Net 替代，但结果可能与论文不完全一致。
        normalization: *id001
        augmentation:
        - name: RandomHorizontalFlip
          p: 0.5
        note: 分割预处理最复杂，复现难度最高（具体性能数字见 experiment.comparison_results）
    version_selector:
      config_key: dataset_version
      values:
      - color
      - grayscale
      - segmented
      default: color
      note: 通过 config.yaml 的 dataset_version 字段切换预处理版本
  split_strategy:
    method: leaf_based_split
    ratios: 'Multiple train-test splits: 80-20, 60-40, 50-50, 40-60, 20-80. Images
      of the same leaf (mappings available for 41,112 out of 54,306 images) always
      go either in the training set or the testing set.'
    leaf_mapping_constraint: 同一片叶子的多张图片必须保持在同一个集合中
