experiment:
  paper_name: 论文1
  pipeline:
  - 'Collect 54,306 images from the PlantVillage dataset. Resize all images to 256x256
    pixels. Prepare three versions of the dataset: color, grayscale, and segmented.
    Split data into train/test sets with multiple ratios while ensuring images of
    the same leaf stay in the same set. Train AlexNet and GoogLeNet models using either
    transfer learning (resetting final classification layer) or training from scratch.
    Train each model for 30 epochs with standardized hyperparameters. Evaluate using
    mean F1 score, mean precision, mean recall, and overall accuracy at the end of
    every epoch. Use final mean F1 score for comparison across all experimental configurations.'
  experiments:
  - name: main_experiment
    description: 'Best performance: GoogLeNet::TransferLearning::Color::80-20 with
      mean F1 score 0.9934 and overall accuracy 99.35%. Worst performance: AlexNet::TrainingFromScratch::GrayScale::80-20
      with mean F1 score 0.8524 and overall accuracy 85.53%. GoogLeNet consistently
      outperforms AlexNet. Transfer learning always yields better results than training
      from scratch. Color > Segmented > Grayscale in terms of performance. On real-world
      images (121 images from trusted online sources), GoogLeNet:Segmented:TransferLearning:80-20
      achieves 31.40% accuracy, 47.93% when crop information is provided, 52.89% top-5
      accuracy. In n>=2 case (33 classes, 9 crops): random accuracy 0.273, model accuracy
      0.478. In n>=3 case (25 classes, 5 crops): random accuracy 0.2, model accuracy
      0.411.'
  evaluation:
    primary_metric: F1
    secondary_metrics:
    - Mean F1 score
    - mean precision
    - mean recall
    - overall accuracy
  comparison:
    baselines:
    - Random guessing (2.63% overall accuracy on 38 classes)
    ablation_factors:
    - mean F1-Score 0.9820
  experiment_matrix:
    dimensions:
      architectures:
      - Alexnet
      - Googlenet
      training_modes:
      - Scratch
      - Transfer
      data_types:
      - Color
      - Grayscale
      - Segmented
      train_test_splits:
      - 80-20
      - 60-40
      - 50-50
      - 40-60
      - 20-80
    total_configurations: 60
    runs:
