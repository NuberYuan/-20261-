paper_name: 论文1
models:
- name: Alexnet
  type: CNN
  code_class_name: Alexnet
  input: Images resized to 256 x 256 pixels
  output: 38 class probability distribution (fc8 has 38 outputs in adapted AlexNet,
    equaling total number of classes)
  num_classes: 38 classes (14 crop species and 26 diseases or absence thereof)
  pretrained: ImageNet pretrained weights for transfer learning. In case of transfer
    learning, they do not limit the learning of the rest of the layers and instead
    just reset the weights of layer fc8 in case of AlexNet; in case of GoogLeNet,
    they similarly do not limit the learning of the rest of the layers but instead
    just reset the weights of the loss{1,2,3}/classifier layers.
  architecture_summary: AlexNet consists of 5 convolution layers, followed by 3 fully
    connected layers, and finally ending with a softmax layer. The first two convolution
    layers (conv{1,2}) are each followed by a normalization and a pooling layer, and
    the last convolution layer (conv5) is followed by a single pooling layer. The
    final fully connected layer (fc8) has 38 outputs in the adapted version. All of
    the first 7 layers have a ReLU nonlinearity activation unit. The first two fully
    connected layers (fc{6,7}) have a
  architecture:
    total_layers: 7
    param_count: 60M
    special_components:
    - type: Normalization
      description: 原文提及 normalization/norm 层；具体类型（BatchNorm / LayerNorm / LocalResponseNorm
        / InstanceNorm）需结合模型与上下文确认。
    - type: Dropout
      details: rate=0.5
    final_classifier: fc8
    implementation_notes: []
    conv_layers: 5
    fc_layers: 3
- name: Googlenet
  type: CNN
  code_class_name: Googlenet
  input: Images resized to 256 x 256 pixels
  output: 38 class probability distribution (fc8 has 38 outputs in adapted AlexNet,
    equaling total number of classes)
  num_classes: 38 classes (14 crop species and 26 diseases or absence thereof)
  pretrained: ImageNet pretrained weights for transfer learning. In case of transfer
    learning, they do not limit the learning of the rest of the layers and instead
    just reset the weights of layer fc8 in case of AlexNet; in case of GoogLeNet,
    they similarly do not limit the learning of the rest of the layers but instead
    just reset the weights of the loss{1,2,3}/classifier layers.
  architecture_summary: 'GoogLeNet is a much deeper and wider architecture with 22
    layers, while still having considerably lower number of parameters (5 million
    parameters) in the network than AlexNet (60 million parameters). A total of 9
    inception modules is used. The inception module uses parallel 1x1, 3x3 and 5x5
    convolutions along with a maxpooling layer in parallel. 1x1 convolutions are added
    before the 3x3, 5x5 convolutions (and also after the maxpooling layer) for dimensionality
    reduction. A filter concatenation '
  architecture:
    total_layers: 22
    param_count: 5M
    special_components:
    - type: Inception
      count: 9
      description: Inception 模块：并行运行多个不同尺度的卷积与池化，结果沿 channel 维度拼接；小尺度卷积用于降维。
      code_implementation: "可自实现 InceptionModule(nn.Module):\n  branches = [conv1x1,\
        \ conv3x3, conv5x5, pool_proj]\n  output = torch.cat([b(x) for b in branches],\
        \ dim=1)"
    final_classifier: loss{1,2,3}/classifier
    implementation_notes: []
    inception_module_count: 9
