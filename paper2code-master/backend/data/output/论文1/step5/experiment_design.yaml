important_results: 'The best performing model (GoogLeNet::TransferLearning::Color::80-20)
  achieves a mean F1 score of 0.9934 and overall accuracy of 99.35% on the PlantVillage
  dataset. On real-world images collected from trusted online sources (121 images),
  the model trained using GoogLeNet:Segmented:TransferLearning:80-20 achieves 31.40%
  overall accuracy (random baseline: 2.63%). When crop information is provided, accuracy
  increases to 47.93%. Top-5 predictions contain correct class in 52.89% of cases.
  Even training on only 20% data achieves 98.21% accuracy with GoogLeNet::TransferLearning::Color::20-80.
  Performance order: Color > Segmented > Grayscale. GoogLeNet > AlexNet. Transfer
  Learning > Training from Scratch.'
