code_generation_plan:
  generation_order:
  - phase: 1
    description: 基础配置
    files:
    - config/config.yaml
    reason: 配置是所有后续模块的基础，必须先定义。
  - phase: 2
    description: 数据模块
    files:
    - data/dataset.py
    reason: 数据加载依赖配置。
  - phase: 3
    description: 核心逻辑（模型/算法）
    files:
    - models/lstm.py
    - models/__init__.py
    reason: 模型/算法是训练和评估的前提。
  - phase: 4
    description: 工具模块
    files:
    - utils/metrics.py
    reason: 指标计算等工具函数。
  - phase: 5
    description: 训练与评估
    files:
    - training/train.py
    - evaluation/evaluate.py
    reason: 训练依赖模型和数据，评估依赖训练好的模型。
  - phase: 6
    description: 入口与文档
    files:
    - main.py
    - requirements.txt
    - README.md
    reason: 入口文件整合所有模块，文档和依赖列表最后生成。
  per_file_specs:
  - file: data/dataset.py
    purpose: 实现 synthetic 数据来源（无外部数据集）
    classes:
    - SyntheticAlgorithmicTasksCopyReverseWalkAddition3NumberAdditionSingleDigitMultiplicationDataset
    key_methods:
    - __init__
    - __len__
    - __getitem__
    - get_dataloaders
    depends_on:
    - config/config.yaml
    satisfies_requirements:
    - FR-01
    - FR-02
    - FR-03
    notes: 【数据来源】data_source=synthetic（非 external_dataset）。数据在代码内生成/合成（随机张量、程序化生成、从分布采样等），绝不读本地文件路径或
      os.listdir。实现 <SyntheticAlgorithmicTasksCopyReverseWalkAddition3NumberAdditionSingleDigitMultiplicationDataset>(...)
      与 get_dataloaders(version=...) 函数，保持与 training/evaluation/main 的调用接口一致（version
      参数可忽略）。不要引入 opencv、不要 open() 读数据集文件。所有 open() 读 config.yaml 必须 encoding='utf-8'。
  - file: models/lstm.py
    purpose: 定义 Lstm 模型结构
    classes:
    - Lstm
    key_methods:
    - __init__
    - forward
    depends_on:
    - config/config.yaml
    satisfies_requirements:
    - FR-04
    notes: '定义 Lstm（随机初始化结构，无迁移学习/预训练权重）。按论文模型结构实现前向传播，不要引入 torchvision 继承或 transfer
      分支。num_classes、dropout_ratio、pretrained 等参数一律从 config.yaml 读取，不要硬编码。【形状参数 null
      兜底】若 config 里的 num_classes/dropout_ratio 等形状参数是 null（论文未给具体类别数/词汇表大小），严禁把 None
      传给 nn.Linear / nn.Embedding 等任何 torch 形状参数（会 empty(): argument ''size'' 崩溃）；必须用从论文描述推导的具体默认值兜底（如「词汇表
      = 数字位数 + 特殊符号」→ 一个具体 int），并在代码注释里写明该默认值来源。模型类只定义结构（随机初始化），不要写 training_mode/transfer
      分支、不要在 __init__ 里 load_state_dict；权重初始化统一在 training/train.py 的 initialize_model
      里处理。所有 open() 读 config.yaml 必须 encoding=''utf-8''。'
  - file: models/__init__.py
    purpose: 模型模块的初始化文件，便于统一导入
    classes: []
    key_methods: []
    depends_on: []
    satisfies_requirements: []
    notes: '导出各模型类，类名必须与各模型文件定义完全一致: from .lstm import Lstm。不要自行改名或改成其他拼写。'
  - file: training/train.py
    purpose: 实现模型训练流程
    classes: []
    key_methods:
    - initialize_model
    - train_model
    - save_model
    depends_on:
    - config/config.yaml
    - data/dataset.py
    - models/lstm.py
    satisfies_requirements:
    - FR-05
    - FR-06
