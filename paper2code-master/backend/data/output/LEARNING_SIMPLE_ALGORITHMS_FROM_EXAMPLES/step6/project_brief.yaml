requirements_digest:
  summary: 本项目包含 8 个功能需求（FR-01、FR-02、FR-03、FR-04、FR-05、FR-06、FR-07、FR-08），涉及 dataset,
    methodology, implementation_details, reproduction_requirements, experiment 维度。
  core_requirements:
  - id: FR-01
    what: 加载/构造 Synthetic algorithmic tasks (copy, reverse, walk, addition, 3-number
      addition, single digit multiplication) 数据集（每个模型训练使用3×10^7个字符）
    why: 论文指定数据集与预处理要求
    acceptance: 加载后样本数应与 每个模型训练使用3×10^7个字符 一致
  - id: FR-02
    what: '预处理步骤: 所有算术运算使用十进制（base 10）。3行加法任务使用额外课程：初始示例不涉及进位且包含许多零。'
    why: 论文指定数据集与预处理要求
    acceptance: 检查输出张量的 shape 和数值范围
  - id: FR-03
    what: 按 训练时使用课程学习，从复杂度6开始，达到100%准确率后增加4，直到模型能解决长度为100的验证序列。测试使用50个长度为100的测试实例，以及长度为1000的测试序列。
      划分训练/测试集
    why: 论文指定数据集与预处理要求
    acceptance: 各集合样本数符合设定比例
  - id: FR-04
    what: 构建 Lstm 模型，能够接收预处理后的输入并输出预测结果
    why: 论文对比的模型与训练策略
    acceptance: 模型可正常实例化并通过前向传播；参数量在合理数量级范围内 （与参考实现同一量级），但不同框架实现可能导致 ±5% 差异（如归一化层、padding
      策略差异），不要求逐参数精确匹配。
  - id: FR-05
    what: 使用 NOT_FOUND 优化器（lr=0.1）训练模型 NOT_FOUND 个 epoch，batch_size=20，损失函数为 Cross-entropy
      loss for symbol prediction; Q-learning loss with penalty term for action learni…
    why: 论文指定的训练超参数
    acceptance: 训练 NOT_FOUND epoch 能完整跑通（无中断、无显存溢出），loss 呈下降趋势。不要求最终 accuracy 接近论文报告值（本阶段只保证训练流程正确，不包含论文原始数据集的完整复现）。
  - id: FR-06
    what: 保存训练过程中最优模型权重和最终模型权重
    why: 复现实验所需
    acceptance: 加载保存的权重后可恢复推理，精度不下降
  - id: FR-07
    what: '在测试集上计算评估指标: Success rate, Test accuracy, Median training time'
    why: 论文报告的主要结果
    acceptance: 输出 Success rate, Test accuracy, Median training time 的值，与论文报告值对比
  - id: FR-08
    what: '[论文要求] 计算并报告: Success rate, Test accuracy, Median training time。关键发现: 使用全部三种Q-learning增强后，模型在所有六个任务上都能成功学习（测试长度100）。在长度为1000的测试序列上，除乘法任务外仍能泛化。监督学习实验中，前馈控制器在copy…'
    why: 论文报告的主要结果
    acceptance: '[论文要求] 评估指标值与论文报告值在容差范围内一致；[工程辅助] 图表可正确生成，不要求与论文图表逐像素一致'
  data_flow_overview: '数据依次经过: 数据加载（数据样本（张量或结构化数据）） → 数据预处理（标准化后的特征张量 (B, F)） → 模型构建（模型定义）（控制器输出包括离散动作（如移动读写头、写入符号）和符号（从词汇表的softmax输出中取最大值））
    → 模型训练（训练好的模型权重 + 训练日志） → 模型评估（评估报告（指标数值 + 可视化））。'
  key_interfaces:
  - from: 数据加载
    to: 数据预处理
    data: 数据样本（张量或结构化数据）
  - from: 数据预处理
    to: 模型构建（模型定义）
    data: 标准化后的特征张量 (B, F)
  - from: 模型构建（模型定义）
    to: 模型训练
    data: 预测输出 (B, NOT_FOUND)
  - from: 模型训练
    to: 模型评估
    data: 训练好的模型权重 + 训练日志（loss/accuracy 曲线数据）
design_digest:
  summary: 项目采用 PyTorch 框架，实现 Lstm，目录结构包含 data, models, training, evaluation, utils,
    config 模块，入口为 main.py。
  tech_stack:
    framework: PyTorch
    key_dependencies:
    - numpy
    - pyyaml
    - torch
    - matplotlib
    hardware: NOT_FOUND
  models:
  - name: Lstm
    type: RNN
    file: models/lstm.py
    key_params: num_classes=NOT_FOUND, pretrained=否
  project_structure:
    root_directories:
    - data
    - models
    - training
    - evaluation
    - utils
    - config
    entry_point: main.py
  training_config_summary:
    optimizer: NOT_FOUND
    learning_rate: '0.1'
    batch_size: '20'
    epochs: '30'
    loss: Cross-entropy loss for symbol prediction; Q-learning loss with penalty term
      for action learning
    scheduler: StepLR (step_size=0, gamma=2.)
decisions:
  framework: PyTorch
  data_source: synthetic
  acquisition: n/a
  val_split_ratio: 0.2
  val_split_note: 80/20 从训练集二次划分出验证集（工程默认，非论文要求）
  training_modes:
  - scratch
  best_metric: val_accuracy
data_dependency:
  data_source: synthetic
  acquisition: n/a
  note: 实验数据为程序化生成的算法任务输入输出对（copy、reverse、walk、加法、乘法等），无外部真实数据集依赖。
