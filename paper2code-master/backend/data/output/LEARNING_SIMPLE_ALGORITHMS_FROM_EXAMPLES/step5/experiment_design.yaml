paper_name: LEARNING_SIMPLE_ALGORITHMS_FROM_EXAMPLES
pipeline:
- 控制器接收当前状态和接口读数。控制器输出离散动作和符号。接口根据动作更新读写头位置或写入符号。训练时符号输出用交叉熵损失通过反向传播更新。动作输出用增强Q-learning更新。训练采用课程学习，从复杂度6开始，达到100%准确率后增加4，直到能解决长度为100的验证序列。
experiments:
- name: main_experiment
  description: 标准Q-learning在大多数任务上失败（copy 90%, reverse 0%, walk 0%, 2-row addition
    70%, 3-row addition 0%, single digit multiplication 100%）。使用全部三种增强后，copy 100%,
    reverse (FF) 100%, walk (FF) 100%, 2-row addition 100%, 3-row addition (extra
    curriculum) 80%, single digit multiplication 100%。在长度为1000的测试序列上，除乘法（0%）外，其他任务仍能泛化（copy
    100%, reverse (FF) 100%, walk (FF) 100%, 2-row addition 100%, 3-row addition 60%）。
evaluation:
  primary_metric: Accuracy
  secondary_metrics:
  - Success rate
  - Test accuracy
  - Median training time
comparison:
  baselines:
  - Standard Q-learning
  - Supervised learning with ground truth actions
  ablation_factors:
  - 论文通过表2对比了不同配置：不同控制器容量（600, 400, 200单元）、不同折扣因子（γ=1, 0.99, 0.95）、是否使用动态折扣（D）、是否使用Watkins
    Q(λ)、是否使用惩罚项。结果表明增加控制器容量会降低性能；动态折扣、Watkins Q(λ)和惩罚项各自都能显著提升性能，三者结合效果最佳。附录B研究了词汇量大小（base
    2到10）对训练时间的影响，发现不频繁但可靠的奖励
experiment_matrix:
  dimensions:
    architectures:
    - LSTM
    - GRU
    - Feedforward Network
    training_modes:
    - Scratch
    data_types:
    - default
    train_test_splits:
    - NOT_FOUND
  total_configurations: 3
  known_best: GRU
  known_worst: Feedforward Network
  run_all: true
  recommended_subset: []
  note: 实验组合 ≤4，可全量跑。
important_results: 使用全部三种Q-learning增强后，模型在所有六个任务上都能成功学习（测试长度100）。在长度为1000的测试序列上，除乘法任务外仍能泛化。监督学习实验中，前馈控制器在copy、reverse、walk任务上完美泛化，但在需要记忆的任务上完全失败。RNN控制器容量过大会导致学习到依赖序列长度的错误自动机，从而无法泛化到更长序列。
