experiment:
  paper_name: 论文5
  pipeline:
  - Input static covariates, known future inputs, and past observed inputs. Encode
    static covariates via GRN encoders to produce context vectors (cs, ce, cc, ch).
    Apply variable selection networks to static, past, and future inputs to select
    relevant features. Feed transformed inputs through an LSTM encoder-decoder (sequence-to-sequence
    layer) for locality enhancement. Apply static enrichment layer with GRN using
    context ce. Apply interpretable multi-head self-attention with decoder masking.
    Apply position-wise feedforward GRN layer with gated residual connection. Generate
    quantile outputs via linear transformation for specified quantiles.
  experiments:
  - name: main_experiment
    description: TFT demonstrates significant performance improvements over existing
      benchmarks on Electricity, Traffic, Retail, and Volatility datasets. Specific
      benchmark comparison numbers were truncated in the provided text.
