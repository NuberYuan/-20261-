reproduction_goal:
  paper_name: 论文5
  title: Temporal Fusion Transformers for Interpretable Multihorizon Time Series Forecasting
  research_problem: Multihorizon forecasting often contains a complex mix of inputs
    – including static (i.e. time-invariant) covariates, known future inputs, and
    other exogenous time series that are only observed in the past – without any prior
    information on how they interact with the target. Existing deep learning methods
    are typically 'black-box' models which do not shed light on how they use the full
    range of inputs present in practical scenarios.
  motivation: Current architectures fail to consider the different types of inputs
    commonly present in multihorizon forecasting, either assume that all exogenous
    inputs are known into the future or neglect important static covariates. Additionally,
    most current architectures are 'black-box' models where forecasts are controlled
    by complex nonlinear interactions, making it difficult to explain how models arrive
    at their predictions. Commonly-used explainability methods (LIME, SHAP) are not
    well-suited for time series as they do not consider time ordering of input features.
  main_contribution: 'TFT introduces multiple novel ideas to align the architecture
    with the full range of potential inputs and temporal relationships common to multihorizon
    forecasting – specifically incorporating (1) static covariate encoders which encode
    context vectors for use in other parts of the network, (2) gating mechanisms throughout
    and sample-dependent variable selection to minimize the contributions of irrelevant
    inputs, (3) a sequence-to-sequence layer to locally process known and observed
    inputs, and (4) a temporal self-attention decoder to learn any long-term dependencies.
    TFT also enables three interpretability use cases: identifying globally-important
    variables, persistent temporal patterns, and significant events.'
  paper_type: model_proposing
  task: time_series_prediction
  input: Static covariates si ∈ R^ms, past observed inputs zi,t ∈ R^mz, known future
    inputs xi,t ∈ R^mx, and scalar targets yi,t ∈ R. Lookback window k and forecast
    horizon τmax vary by dataset (e.g. k=168, τmax=24 for Electricity/Traffic; k=90,
    τmax=30 for Retail; k=252, τmax=5 for Volatility).
  output: Quantile forecasts ŷ(q, t, τ) for τ ∈ {1, ..., τmax} using quantiles Q =
    {0.1, 0.5, 0.9}, generated via linear transformation of decoder output.
  num_classes: NOT_FOUND
  reproduction_targets:
  - 实现论文提出的模型架构
  - 复现训练流程
  - 复现评估指标计算
  - 验证与论文结果的一致性
  is_trainable: true
