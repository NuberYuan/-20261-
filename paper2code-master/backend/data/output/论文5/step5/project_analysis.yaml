    source: 论文提到
  architecture_details:
    lstm: LSTM encoder-decoder for locality enhancement. Feeding ξ̃(t-k:t) into the
      encoder and ξ̃(t+1:t+τmax) into the decoder. cc and ch context vectors from
      static covariate encoders initialize the cell state and hidden state respectively
      for the first LSTM in the layer. Gated skip connection over this layer.
    transformer: 'Interpretable Multi-Head Attention modifies standard multi-head
      attention by sharing value weights WV across all heads and using additive aggregation
      of all heads: InterpretableMultiHead(Q, K, V) = H̃ WH where H̃ = Ã(Q,K) V WV
      = (1/H) Σ A(Q W_K^(h)) V WV. dV = d_attn = d_model/mH. Decoder masking is applied.
      A single interpretable multi-head attention layer is used to preserve explainability.'
  training:
    optimizer:
      type: NOT_FOUND
    loss:
      type: 'Quantile loss (QL), summed across all quantile outputs: L(Ω, W) = Σ Σ
        Σ QL(yt, ŷ(q, t-τ, τ), q) / (M τmax), where QL(y, ŷ, q) = q(y - ŷ)+ + (1 -
        q)(ŷ - y)+'
    scheduler:
      type: NOT_FOUND
  pretrained_weights:
    used: false
    source: NOT_FOUND
  special_modules: Gated Residual Network (GRN), Gated Linear Units (GLU), Variable
    Selection Networks, Static Covariate Encoders (producing context vectors cs, ce,
    cc, ch), Interpretable Multi-Head Attention, LSTM Encoder-Decoder, Static Enrichment
