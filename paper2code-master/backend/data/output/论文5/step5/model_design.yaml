paper_name: 论文5
models:
- name: Lstm
  type: RNN
  code_class_name: Lstm
  input: Static covariates si ∈ R^ms, past observed inputs zi,t ∈ R^mz, known future
    inputs xi,t ∈ R^mx, and scalar targets yi,t ∈ R. Lookback window k and forecast
    horizon τmax vary by dataset (e.g. k=168, τmax=24 for Electricity/Traffic; k=90,
    τmax=30 for Retail; k=252, τmax=5 for Volatility).
  output: Quantile forecasts ŷ(q, t, τ) for τ ∈ {1, ..., τmax} using quantiles Q =
    {0.1, 0.5, 0.9}, generated via linear transformation of decoder output.
  num_classes: NOT_FOUND
  pretrained: NOT_FOUND
  architecture_summary: LSTM encoder-decoder for locality enhancement. Feeding ξ̃(t-k:t)
    into the encoder and ξ̃(t+1:t+τmax) into the decoder. cc and ch context vectors
    from static covariate encoders initialize the cell state and hidden state respectively
    for the first LSTM in the layer. Gated skip connection over this layer.
  architecture:
    total_layers: NOT_FOUND
    param_count: NOT_FOUND
    special_components: []
    final_classifier: NOT_FOUND
    implementation_notes: []
- name: Transformer
  type: Transformer
  code_class_name: Transformer
  input: Static covariates si ∈ R^ms, past observed inputs zi,t ∈ R^mz, known future
    inputs xi,t ∈ R^mx, and scalar targets yi,t ∈ R. Lookback window k and forecast
    horizon τmax vary by dataset (e.g. k=168, τmax=24 for Electricity/Traffic; k=90,
    τmax=30 for Retail; k=252, τmax=5 for Volatility).
  output: Quantile forecasts ŷ(q, t, τ) for τ ∈ {1, ..., τmax} using quantiles Q =
    {0.1, 0.5, 0.9}, generated via linear transformation of decoder output.
  num_classes: NOT_FOUND
  pretrained: NOT_FOUND
  architecture_summary: 'Interpretable Multi-Head Attention modifies standard multi-head
    attention by sharing value weights WV across all heads and using additive aggregation
    of all heads: InterpretableMultiHead(Q, K, V) = H̃ WH where H̃ = Ã(Q,K) V WV =
    (1/H) Σ A(Q W_K^(h)) V WV. dV = d_attn = d_model/mH. Decoder masking is applied.
    A single interpretable multi-head attention layer is used to preserve explainability.'
  architecture:
    total_layers: NOT_FOUND
    param_count: NOT_FOUND
    special_components: []
    final_classifier: NOT_FOUND
    implementation_notes: []
