paper_name: 论文5
models:
- name: Lstm
  type: RNN
  code_class_name: Lstm
  input: Static metadata, past-observed time-varying inputs, and a priori known future
    time-varying inputs. The model uses a finite lookback window k for target and
    known inputs up to forecast start time t, and known inputs across t-k to t+tau.
    Input types include static covariates si in R^{ms}, observed inputs zi,t in R^{mz},
    known inputs xi,t in R^{mx}, and scalar targets yi,t in R.
  output: 'Quantile forecasts for horizons tau=1,...,tau_max at each time step, for
    quantiles q in {0.1, 0.5, 0.9}. Each quantile forecast is generated by a linear
    transformation: yhat(q,t,tau)=Wq psi_tilde(t,tau)+bq.'
  num_classes: NOT_FOUND
  pretrained: NOT_FOUND
  architecture_summary: A sequence-to-sequence LSTM encoder-decoder is used for locality
    enhancement. Past selected features xi_tilde_{t-k:t} are fed into the encoder
    and future selected features xi_tilde_{t+1:t+tau_max} into the decoder. Static
    context vectors cc and ch initialize the cell state and hidden state respectively
    for the first LSTM in the layer. A gated skip connection is applied over this
    layer.
  architecture:
    total_layers: NOT_FOUND
    param_count: NOT_FOUND
    special_components: []
    final_classifier: NOT_FOUND
    implementation_notes: []
