project:
  name: Temporal_Fusion_Transformers_for_Interpretable_Mul
  description: time_series_prediction
  paper_type: model_proposing
architecture:
  modules:
    data:
      directory: data/
      files:
      - dataset.py
      description: 数据加载与预处理
    models:
      directory: models/
      files:
      - lstm.py
      - transformer.py
      description: '模型定义: lstm, transformer'
      classes:
      - name: Lstm
        type: RNN
        input: Static covariates si ∈ R^ms, past observed inputs zi,t ∈ R^mz, known
          future inputs xi,t ∈ R^mx, and scalar targets yi,t ∈ R. Lookback window
          k and forecast horizon τmax vary by dataset (e.g. k=168, τmax=24 for Electricity/Traffic;
          k=90, τmax=30 for Retail; k=252, τmax=5 for Volatility).
        output: Quantile forecasts ŷ(q, t, τ) for τ ∈ {1, ..., τmax} using quantiles
          Q = {0.1, 0.5, 0.9}, generated via linear transformation of decoder output.
        pretrained: NOT_FOUND
        file: models/lstm.py
      - name: Transformer
        type: Transformer
        input: Static covariates si ∈ R^ms, past observed inputs zi,t ∈ R^mz, known
          future inputs xi,t ∈ R^mx, and scalar targets yi,t ∈ R. Lookback window
          k and forecast horizon τmax vary by dataset (e.g. k=168, τmax=24 for Electricity/Traffic;
          k=90, τmax=30 for Retail; k=252, τmax=5 for Volatility).
        output: Quantile forecasts ŷ(q, t, τ) for τ ∈ {1, ..., τmax} using quantiles
          Q = {0.1, 0.5, 0.9}, generated via linear transformation of decoder output.
        pretrained: NOT_FOUND
        file: models/transformer.py
    training:
      directory: training/
      files:
      - train.py
      description: 训练循环
    evaluation:
      directory: evaluation/
      files:
      - evaluate.py
      description: 评估与对比
    utils:
      directory: utils/
      files:
      - metrics.py
      description: 工具函数
    config:
      directory: config/
      files:
      - config.yaml
      description: YAML 配置
dependencies:
  files:
  - README.md
  - config/config.yaml
  - data/dataset.py
  - evaluation/evaluate.py
  - main.py
  - models/lstm.py
  - models/transformer.py
  - requirements.txt
  - training/train.py
  - utils/metrics.py
  external:
  - torch
  - torchvision
  - numpy
  - pyyaml
  - scikit-learn
  - pillow
  - opencv-python
execution_flow:
- 1. 加载配置 (config/config.yaml)
- '2. data/: 准备数据集和数据加载器'
- '3. models/: 初始化模型'
- '4. training/train.py: 训练循环与验证评估'
- '5. evaluation/: 测试集评估'
reproducibility_notes:
- Implementing the Interpretable Multi-Head Attention with shared value weights and
  additive head aggregation
- Properly wiring four different static context vectors (cs, ce, cc, ch) into different
  parts of the network
- Implementing decoder masking for causal information flow in self-attention
- Handling the LSTM encoder-decoder with differing numbers of past and future inputs
- Reproducing exact results requires the same random search hyperparameter optimization
  process
- The programming framework is not explicitly stated in the paper
code_requirements: {}
