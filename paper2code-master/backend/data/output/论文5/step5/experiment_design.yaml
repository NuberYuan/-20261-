paper_name: 论文5
pipeline:
- Input static metadata, past-observed inputs and future-known inputs. Apply variable
  selection to static, past and future inputs. Encode static covariates into context
  vectors cs, ce, cc, ch. Process selected temporal features with LSTM encoder-decoder
  locality enhancement. Apply static enrichment, temporal self-attention and positionwise
  feedforward layers. Generate quantile forecasts via linear transformation. Train
  by jointly minimizing quantile loss across all quantiles and horizons.
