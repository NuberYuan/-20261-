important_results: TFT optimal model for Electricity takes slightly over 6 hours to
  train on NVIDIA Tesla V100 (each epoch roughly 52 mins). Batched inference on 50,000
  validation samples takes 8 minutes. TFT achieves significant performance improvements
  over existing benchmarks on all four real-world datasets.
