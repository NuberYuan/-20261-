important_results: 'TFT demonstrates significant performance improvements over existing
  benchmarks on a variety of real-world datasets. For the Electricity dataset, the
  optimal TFT model trains in slightly over 6 hours on an NVIDIA Tesla V100 GPU, each
  epoch being roughly 52 mins, and batched inference on the entire validation dataset
  of 50,000 samples takes 8 minutes. TFT enables three interpretability use cases:
  identifying globally important variables, persistent temporal patterns, and significant
  events. Variable importance results include Electricity static ID 1.000, past power
  usage 0.342/0.359/0.366, future hour-of-day 0.718/0.738/0.739; Traffic past occupancy
  0.471/0.473/0.483; Volatility past realized volatility 0.620/0.647/0.714.'
