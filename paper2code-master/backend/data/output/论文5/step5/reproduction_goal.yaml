paper_name: 论文5
title: Temporal Fusion Transformers for Interpretable Multihorizon Time Series Forecasting
research_problem: Multihorizon forecasting often contains a complex mix of inputs
  including static covariates, known future inputs, and exogenous time series only
  observed in the past, without prior information on how they interact with the target.
  Existing deep learning methods are often black-box models and do not handle this
  heterogeneity, and common explainability methods are not well-suited for time series.
motivation: Multihorizon forecasting has impactful real-world applications in retail,
  healthcare and economics. Practical datasets contain heterogeneous data sources,
  and most current architectures fail to consider different input types or provide
  interpretable insights into temporal dynamics. The authors argue that designing
  networks with suitable inductive biases for multihorizon forecasting and enabling
  interpretability can improve performance and user trust.
main_contribution: The paper introduces the Temporal Fusion Transformer (TFT), an
  attention-based architecture that combines high-performance multihorizon forecasting
  with interpretable insights into temporal dynamics. TFT uses recurrent layers for
  local processing, interpretable self-attention for long-term dependencies, variable
  selection networks, static covariate encoders, and gating layers to suppress unnecessary
  components.
paper_type: model_proposing
task: time_series_prediction
input: Static metadata, past-observed time-varying inputs, and a priori known future
  time-varying inputs. The model uses a finite lookback window k for target and known
  inputs up to forecast start time t, and known inputs across t-k to t+tau. Input
  types include static covariates si in R^{ms}, observed inputs zi,t in R^{mz}, known
  inputs xi,t in R^{mx}, and scalar targets yi,t in R.
output: 'Quantile forecasts for horizons tau=1,...,tau_max at each time step, for
  quantiles q in {0.1, 0.5, 0.9}. Each quantile forecast is generated by a linear
  transformation: yhat(q,t,tau)=Wq psi_tilde(t,tau)+bq.'
