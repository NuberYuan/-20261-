code_generation_plan:
  generation_order:
  - phase: 1
    description: 基础配置
    files:
    - config/config.yaml
    reason: 配置是所有后续模块的基础，必须先定义。
  - phase: 2
    description: 数据模块
    files:
    - data/dataset.py
    reason: 数据加载依赖配置。
  - phase: 3
    description: 核心逻辑（模型/算法）
    files:
    - models/lstm.py
    - models/transformer.py
    - models/__init__.py
    reason: 模型/算法是训练和评估的前提。
  - phase: 4
    description: 工具模块
    files:
    - utils/metrics.py
    reason: 指标计算等工具函数。
  - phase: 5
    description: 训练与评估
    files:
    - training/train.py
    - evaluation/evaluate.py
    reason: 训练依赖模型和数据，评估依赖训练好的模型。
  - phase: 6
    description: 入口与文档
    files:
    - main.py
    - requirements.txt
    - README.md
    reason: 入口文件整合所有模块，文档和依赖列表最后生成。
  per_file_specs:
  - file: data/dataset.py
    purpose: 实现数据集加载、预处理和划分
    classes:
    - ElectricityUCIElectricityLoadDiagramsTrafficUCIPEMSFTrafficRetailFavoritaGrocerySalesFromKaggleVolatilityOxfordManInstituteRealizedLibraryDataset
    key_methods:
    - __init__
    - __len__
    - __getitem__
    - preprocess_data
    - split_dataset
    depends_on:
    - config/config.yaml
    satisfies_requirements:
    - FR-01
    - FR-02
    - FR-03
    notes: 实现数据集加载、预处理和划分。需处理 default 等版本。所有 open() 读文件必须显式 encoding='utf-8'（config.yaml
      含中文，Windows 默认 GBK 会读崩）。【version 数据流】get_dataloaders（或等价加载函数）必须接受 version 参数（默认
      'default'），并把它原样传给 ElectricityUCIElectricityLoadDiagramsTrafficUCIPEMSFTrafficRetailFavoritaGrocerySalesFromKaggleVolatilityOxfordManInstituteRealizedLibraryDataset(version=...)；绝不能从
      config['data'] 读默认值写死，否则各版本实验无差别。【非图像数据】数据是图/文本/序列/表格等非图像数据，不要引入 PIL/opencv
      或图像增强；按论文的数据格式加载（如解析文本/JSON 图文件、读取序列、读取 CSV 等），并把预处理逻辑放在 preprocess_data 方法里（按论文描述实现，无图像通道/尺寸概念）。
  - file: models/lstm.py
    purpose: 定义 Lstm 模型结构
    classes:
    - Lstm
    key_methods:
    - __init__
    - forward
    depends_on:
    - config/config.yaml
    satisfies_requirements:
    - FR-04
    notes: '定义 Lstm（随机初始化结构，无迁移学习/预训练权重）。按论文模型结构实现前向传播，不要引入 torchvision 继承或 transfer
      分支。num_classes、dropout_ratio、pretrained 等参数一律从 config.yaml 读取，不要硬编码。【形状参数 null
      兜底】若 config 里的 num_classes/dropout_ratio 等形状参数是 null（论文未给具体类别数/词汇表大小），严禁把 None
