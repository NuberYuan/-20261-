project:
  name: Temporal_Fusion_Transformers_for_Interpretable_Mul
  paper_title: Temporal Fusion Transformers for Interpretable Multihorizon Time Series
    Forecasting
  paper_type: model_proposing
  task: time_series_prediction
  one_liner: 复现论文中 Lstm、Transformer 在 Electricity (UCI Electricity Load Diagrams),
    Traffic (UCI PEM-SF Traffic), Retail (Favorita Grocery Sales from Kaggle), Volatility
    (Oxford-Man Institute realized library) 上的time_series_prediction，对比不同训练模式与数据划分下的性能。
