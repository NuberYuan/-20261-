experiment:
  paper_name: RULE-BASED_GRAPH_PROGRAMS_MATCHING_THE_TIME
  pipeline:
  - 'GP 2 programs are compiled to C code by the new GP 2-to-C compiler. GCC transforms
    the C code into platform-dependent binaries executed by the runtime system. The
    runtime reads and parses the input host graph. Matching uses constant-time operations
    for nodes, roots, marks, degrees, sources, targets, and mark/orientation-specific
    edge lists. The paper then presents three case studies: connectedness in linear
    time, acyclicity in linear time, and Bellman-Ford in O(nm).'
  experiments:
  - name: main_experiment
    description: The connectedness program runs in linear time on possibly disconnected
      input graphs with arbitrary node degrees, removing the previous bounded-degree
      constraint. The acyclicity program runs in linear time on possibly disconnected
      input graphs with arbitrary node degrees. The Bellman-Ford program runs in O(nm)
      on arbitrary input graphs, matching the time complexity of imperative Bellman-Ford
      implementations. Runtime experiments on various graph classes support the complexity
      claims.
  evaluation:
    primary_metric: Time complexity
    secondary_metrics:
    - Time complexity
    - correctness proofs
    - runtime measurements
  comparison:
    baselines:
    - 2020 GP 2 compiler
    - previous bounded-degree GP 2 programs
