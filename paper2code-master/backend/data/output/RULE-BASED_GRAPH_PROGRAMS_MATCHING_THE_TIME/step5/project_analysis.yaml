  important_results: First two programs run in linear time on possibly disconnected
    input graphs with arbitrary node degrees. The Bellman-Ford program runs in O(nm)
    on arbitrary input graphs, where n is the number of nodes and m is the number
    of edges. To the best of the authors' knowledge, this is the first rule-based
    shortest-path implementation matching the complexity of an imperative Bellman-Ford
    algorithm.
