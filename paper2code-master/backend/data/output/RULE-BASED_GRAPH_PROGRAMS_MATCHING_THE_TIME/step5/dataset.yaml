paper_name: RULE-BASED_GRAPH_PROGRAMS_MATCHING_THE_TIME
data_source: synthetic
acquisition: n/a
data_source_note: 论文未命名真实公开数据集，实验所用的各类主图和根循环图属于程序化生成的合成图类，仅由运行时从磁盘读取解析。
datasets:
- name: NOT_FOUND
  source: NOT_FOUND
  size: NOT_FOUND
  num_classes: NOT_FOUND
  data_type: Host graphs for connectedness, acyclicity, and Bellman-Ford runtime experiments
    on various graph classes; Figure 36 uses rooted cycle graphs of negative total
    weight.
dataset_versions:
- default
preprocessing:
  versions:
    default:
      description: 非图像数据：通用预处理（按数据语义做标准化/归一化）
      preprocessing: The input host graph is read and parsed from disk by the runtime
        system; no training/test split is reported.
      normalization:
        note: 非图像数据无 RGB 通道概念，按数据语义做标准化（如 z-score/归一化）
      augmentation: []
      note: 数据集无颜色/灰度/分割版本；仅单一 default 版本
  version_selector:
    config_key: dataset_version
    values:
    - default
    default: default
    note: 非图像数据仅一个 default 版本
split_strategy:
  method: random_split
  ratios: NOT_FOUND
  leaf_mapping_constraint: NOT_FOUND
