project:
  name: "Rule-Based Graph Programs Matching the Time Complexity of Imperative Algorithms"
  paper: "Rule-Based Graph Programs Matching the Time Complexity of Imperative Algorithms"
  framework: "Python 标准库"

experiment:
  runs:
    - name: "default"
      data_source: "synthetic"
      acquisition: "n/a"
      dataset_version: "default"
      algorithm_params: {}

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  log_dir: "logs"
  console: true

system:
  device: "cpu"
  num_workers: 0
  seed: 42

data_source: "synthetic"
acquisition: "n/a"

dataset_versions:
  - "default"

version_selector:
  config_key: "dataset_version"
  values:
    - "default"
  default: "default"
  note: "非图像数据仅一个 default 版本"

algorithm_params: {}