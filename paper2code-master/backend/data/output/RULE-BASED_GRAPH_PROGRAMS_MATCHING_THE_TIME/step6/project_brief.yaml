requirements_digest:
  summary: 本项目包含 6 个功能需求（FR-01、FR-02、FR-03、FR-04、FR-05、FR-06），涉及 dataset, methodology,
    experiment 维度。
  core_requirements:
  - id: FR-01
    what: '预处理步骤: The input host graph is read and parsed from disk by the runtime
      system; no training/test split is reported.'
    why: 论文指定数据集与预处理要求
    acceptance: 检查输出张量的 shape 和数值范围
  - id: FR-02
    what: 构建 GP 2 connectedness program 模型，能够接收预处理后的输入并输出预测结果
    why: 论文对比的模型与训练策略
    acceptance: 模型可正常实例化并通过前向传播；参数量在合理数量级范围内 （与参考实现同一量级），但不同框架实现可能导致 ±5% 差异（如归一化层、padding
      策略差异），不要求逐参数精确匹配。
  - id: FR-03
    what: 构建 GP 2 acyclicity program 模型，能够接收预处理后的输入并输出预测结果
    why: 论文对比的模型与训练策略
    acceptance: 模型可正常实例化并通过前向传播；参数量在合理数量级范围内 （与参考实现同一量级），但不同框架实现可能导致 ±5% 差异（如归一化层、padding
      策略差异），不要求逐参数精确匹配。
  - id: FR-04
    what: 构建 GP 2 Bellman-Ford program 模型，能够接收预处理后的输入并输出预测结果
    why: 论文对比的模型与训练策略
    acceptance: 模型可正常实例化并通过前向传播；参数量在合理数量级范围内 （与参考实现同一量级），但不同框架实现可能导致 ±5% 差异（如归一化层、padding
      策略差异），不要求逐参数精确匹配。
  - id: FR-05
    what: '在测试集上计算评估指标: Time complexity, correctness proofs, runtime measurements'
    why: 论文报告的主要结果
    acceptance: 输出 Time complexity, correctness proofs, runtime measurements 的值，与论文报告值对比
  - id: FR-06
    what: '[论文要求] 计算并报告: Time complexity, correctness proofs, runtime measurements。关键发现:
      First two programs run in linear time on possibly disconnected input graphs
      with a…'
    why: 论文报告的主要结果
    acceptance: '[论文要求] 评估指标值与论文报告值在容差范围内一致；[工程辅助] 图表可正确生成，不要求与论文图表逐像素一致'
  data_flow_overview: '数据依次经过: 模型构建（模型定义）（Output host graph, or failure if the program
    fails or the input violates the checked property.） → 模型评估（评估报告（指标数值 + 可视化））。'
  key_interfaces:
  - from: 模型构建（模型定义）
    to: 模型评估
    data: Output host graph, or failure if the program fails or the input violates
      the checked property.
