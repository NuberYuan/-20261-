  - file: src/gp2compilerenhancementsandrootedgraphprograms.py
    purpose: 实现论文方法 gp2compilerenhancementsandrootedgraphprograms
    classes: []
    key_methods:
    - run
    depends_on:
    - config/config.yaml
    satisfies_requirements: []
    notes: '实现论文提出的算法/方法，构造输入并验证与论文结果的一致性。不要引入 torch/torchvision（非训练论文），依赖 numpy/pyyaml。所有
      open() 读配置文件必须 encoding=''utf-8''。

      【复现目标】论文核心贡献：The paper enhances the GP 2 compiler graph data structure by storing
      nodes in separate linked lists based on marks and giving each node a two-dimensional
      array of linked lists for incident edges by mark and orientation. It presents
      three case studies with correctness and time-complexity proofs plus runtime
      experiments: connectedness checking in linear time on arbitrary input graphs
      with arbitrary node degrees, acyclicity checking in linear time on arbitrary
      input graphs, and Bellman-Ford single-source shortest paths in O(nm) on arbitrary
      input graphs, matching imperative Bellman-Ford.；论文关键结果/案例：First two programs
      run in linear time on possibly disconnected input graphs with arbitrary node
      degrees. The Bellman-Ford program runs in O(nm) on arbitrary input graphs, where
