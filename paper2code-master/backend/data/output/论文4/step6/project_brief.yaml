      as plt except ImportError: plt = None），所有绘图函数在 plt is None 时直接跳过并返回 None，generate_report
      在无 matplotlib 时仍输出文本报告。严禁因 matplotlib 缺失在 import 阶段或运行期崩溃——指标计算与文本报告必须无条件完成。'
  - file: src/enhancedgp2compilerwithimprovedgraphdatastructure.py
    purpose: 实现论文方法 enhancedgp2compilerwithimprovedgraphdatastructure
    classes: []
    key_methods:
    - run
    depends_on:
    - config/config.yaml
    satisfies_requirements:
    - FR-02
    notes: '实现论文提出的算法/方法，构造输入并验证与论文结果的一致性。不要引入 torch/torchvision（非训练论文），依赖 numpy/pyyaml。所有
      open() 读配置文件必须 encoding=''utf-8''。

      【复现目标】论文核心贡献：The paper enhances the graph data structure generated by the GP
      2 compiler by storing nodes in separate linked lists based on marks and incident
      edges in a two-dimensional array of linked lists based on marks and orientation.
      Three case studies are presented: (1) a GP 2 program checking connectedness
      in linear time on arbitrary input graphs, (2) a program recognising acyclic
      graphs in linear time, and (3) a rule-based implementation of Bellman-Ford single-source
      shortest-path algorithm running in O(nm) time, matching imperative complexity.
      Each comes with correctness and time complexity proofs…；论文关键结果/案例：The first
      two programs run in linear time on (possibly disconnected) input graphs with
      arbitrary node degrees. The third program runs in time O(nm) on arbitrary input
      graphs, matching the time complexity of imperative implementations of the Bellman-Ford
      algorithm. The worst-case complexity of matching the forward rule in the old
      isconnected program is 2|E| + P_{i=1}^{|E|} i = O(|E|^2) where E is the set
      of edges.。实现时必须覆盖这些具体案例/程序（而非无关示例），构造对应输入验证正确性，并对论文的时间复杂度等结论给出定性验证。'
  - file: config/config.yaml
    purpose: 集中管理所有配置参数
    classes: []
    key_methods: []
    depends_on: []
    satisfies_requirements: []
    notes: '本论文无训练、无外部数据：不要生成 data/model/training_modes/training/checkpoint/inference/split_strategy
      键，仅包含算法参数与运行配置。顶层键必须包含: project（name/paper/framework: Python 标准库）、experiment（runs
      列表）、logging、system（device/num_workers/seed）。其余代码读取的键都必须在此列全，避免代码引用不存在的键。【NOT_FOUND
      禁止入数值】凡代码会当数字消费的字段（num_classes/batch_size/epochs/learning_rate/feature_dim/dropout_ratio
      等），论文能推导出具体值时必须写具体数字；确实未知时写 null 或省略该键（让代码用 .get(key, 默认值) 兜底），严禁写字符串 ''NOT_FOUND''，否则代码里
      np.zeros((''NOT_FOUND'',''NOT_FOUND'')) 或 int(''NOT_FOUND'') 会崩溃。【data_source/acquisition】顶层必须写
      data_source 和 acquisition 两个键，本论文固定为 data_source: synthetic、acquisition: n/a（data_source
      非 external_dataset，data 段无需 path，数据在代码内生成/来自环境）；同时每个 experiment.runs[] 条目也必须带
      data_source 和 acquisition（值同上）。这两个键由 Step7 确定性注入兜底，LLM 写错也会被覆盖，但请保持一致，勿省略。'
