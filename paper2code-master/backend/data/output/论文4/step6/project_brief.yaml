    notes: '计算评估指标；生成论文要求数值报告和工程辅助图表。【接口约定】generate_report 的签名是 (metrics, run_name,
      output_dir, config)，返回单个 run 的报告路径（不要做成接收 results 字典并批量绘制对比图的函数）。本文件只提供 evaluate_model
      / generate_report 等函数，不要写 __main__ 入口或目录扫描逻辑（入口统一在 main.py）。【绘图参数】_generate_metrics_bar_chart
