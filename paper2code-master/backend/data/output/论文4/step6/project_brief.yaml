requirements_digest:
  summary: 本项目包含 4 个功能需求（FR-01、FR-02、FR-03、FR-04），涉及 dataset, methodology, experiment
    维度。
  core_requirements:
  - id: FR-01
    what: 加载/构造 various graph classes 数据集（NOT_FOUND）
    why: 论文指定数据集与预处理要求
    acceptance: 加载后样本数应与 NOT_FOUND 一致
  - id: FR-02
    what: '实现论文提出的方法: Enhanced GP 2 compiler with improved graph data structure'
    why: 论文对比的模型与训练策略
    acceptance: 算法可运行并产出预期格式的输出，与论文示例/结论一致
  - id: FR-03
    what: '在测试集上计算评估指标: runtime measurements'
    why: 论文报告的主要结果
    acceptance: 输出 runtime measurements 的值，与论文报告值对比
  - id: FR-04
    what: '[论文要求] 计算并报告: runtime measurements。关键发现: The first two programs run in
      linear time on (possibly disconnected) input graphs with arbitrary node degrees.
      The thir…'
    why: 论文报告的主要结果
    acceptance: '[论文要求] 评估指标值与论文报告值在容差范围内一致；[工程辅助] 图表可正确生成，不要求与论文图表逐像素一致'
  data_flow_overview: '数据依次经过: 数据加载（数据样本（张量或结构化数据）） → 数据预处理（标准化后的特征张量 (B, F)） → 算法执行（算法输出结果）
    → 模型评估（验证报告（结果一致性））。'
  key_interfaces:
  - from: 数据加载
    to: 数据预处理
    data: 数据样本（张量或结构化数据）
  - from: 数据预处理
    to: 算法执行
    data: 标准化后的特征张量 (B, F)
  - from: 算法执行
    to: 模型评估
    data: 算法输出结果
