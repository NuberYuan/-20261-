    notes: '计算评估指标；生成论文要求数值报告和工程辅助图表。【接口约定】generate_report 的签名是 (metrics, run_name,
      output_dir, config)，返回单个 run 的报告路径（不要做成接收 results 字典并批量绘制对比图的函数）。本文件只提供 evaluate_model
      / generate_report 等函数，不要写 __main__ 入口或目录扫描逻辑（入口统一在 main.py）。【绘图参数】_generate_metrics_bar_chart
      接收完整的 metrics dict（内部一次绘制 mean_f1/precision/recall/accuracy），调用时传 metrics 整个
      dict，严禁传 metrics[''mean_f1''] 单标量；_generate_confusion_matrix_plot 则接收 metrics[''confusion_matrix'']
      二维数组。【matplotlib 可选】matplotlib 仅是可视化辅助依赖，目标环境可能未安装，不要假设它一定存在。文件顶部必须用 try/except
      包裹 matplotlib 导入（try: import matplotlib; matplotlib.use(''Agg''); import matplotlib.pyplot
      as plt except ImportError: plt = None），所有绘图函数在 plt is None 时直接跳过并返回 None，generate_report
