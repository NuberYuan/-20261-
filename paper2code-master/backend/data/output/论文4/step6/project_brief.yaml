    satisfies_requirements:
    - FR-01
    - FR-02
    - FR-03
    - FR-04
    notes: 解析配置，执行论文方法（算法），验证与论文结果的一致性。所有 open() 读配置文件必须 encoding='utf-8'。【命令行参数】支持
