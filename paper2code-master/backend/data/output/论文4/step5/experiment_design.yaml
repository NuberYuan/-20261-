important_results: The first two programs run in linear time on (possibly disconnected)
  input graphs with arbitrary node degrees. The third program runs in time O(nm) on
  arbitrary input graphs, matching the time complexity of imperative implementations
  of the Bellman-Ford algorithm. The worst-case complexity of matching the forward
  rule in the old isconnected program is 2|E| + P_{i=1}^{|E|} i = O(|E|^2) where E
  is the set of edges.
