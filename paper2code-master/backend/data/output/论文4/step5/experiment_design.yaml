paper_name: 论文4
pipeline:
- GP 2 programs are compiled to C programs using the GP 2-to-C compiler. C programs
  are transformed by GCC into platform-dependent binaries. Binaries are executed by
  the runtime system which reads an input graph from disc.
experiments:
- name: main_experiment
  description: The paper provides runtime experiments on six classes of input graphs
    for the connectivity checking program and various classes for the acyclicity and
    Bellman-Ford programs. Specific numerical results are in truncated figures (e.g.,
    Figure 36 shows measured performance of bellmanford on rooted cycle graphs of
    negative total weight).
evaluation:
  primary_metric: runtime measurements
  secondary_metrics:
  - runtime measurements
