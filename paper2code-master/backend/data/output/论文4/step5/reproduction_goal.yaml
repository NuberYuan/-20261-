paper_name: 论文4
title: RULE-BASED GRAPH PROGRAMS MATCHING THE TIME COMPLEXITY OF IMPERATIVE ALGORITHMS
research_problem: Rule-based graph transformation languages generally fail to achieve
  the asymptotic runtime efficiency of imperative languages due to the cost of graph
  matching. Previous work with rooted rules could match imperative time complexity
  but required input graphs to have bounded node degree and, for some algorithms,
  to be connected. This paper addresses these limitations.
motivation: Matching the lefthand graph L of a rule within a host graph G generally
  requires time |G|^|L|, so standard imperative graph algorithms running in linear
  time may exhibit nonlinear, polynomial runtimes when recast as rule-based graph
  programs. Existing GP 2 programs with rooted rules needed bounded node degree and
  connectivity constraints. Overcoming these constraints enables linear-time and O(nm)-time
  rule-based graph programs on arbitrary input graphs.
main_contribution: 'The paper enhances the graph data structure generated by the GP
  2 compiler by storing nodes in separate linked lists based on marks and incident
  edges in a two-dimensional array of linked lists based on marks and orientation.
  Three case studies are presented: (1) a GP 2 program checking connectedness in linear
  time on arbitrary input graphs, (2) a program recognising acyclic graphs in linear
  time, and (3) a rule-based implementation of Bellman-Ford single-source shortest-path
  algorithm running in O(nm) time, matching imperative complexity. Each comes with
  correctness and time complexity proofs and runtime experiments.'
